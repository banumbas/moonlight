- type: entity
  id: MoonlightCrystalBase
  abstract: true
  parent: BaseStructure
  name: crystals
  description: A large, glowing crystal formation.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Moonlight/Structures/Decoration/crystal.rsi
    layers:
      - state: medium1
        map: ["random", "enum.MiningScannerVisualLayers.Overlay"]
        shader: unshaded
    offset: 0, 0.25
    noRot: true
  - type: InteractionPopup
    interactSuccessString: moonlight-popup-crystal-ding
    messagePerceivedByOthers: moonlight-popup-crystal-ding
    interactSuccessSound:
      collection: MoonlightCrystalDings
      params:
        variation: 0.03
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 60
        mask:
          - MachineMask
        layer:
          - MidImpassable
          - LowImpassable
          - BulletImpassable
          - Opaque
  - type: PointLight
    netSync: false
    radius: 2.5
    energy: 1
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Rock
  - type: MiningScannerViewable

- type: entity
  id: MoonlightCrystalBaseBig
  abstract: true
  parent: MoonlightCrystalBase
  components:
  - type: RandomSprite
    available:
    - random:
        big0: Inherit
        big1: Inherit
        big2: Inherit
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/glass_smash.ogg

