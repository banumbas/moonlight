- type: entity
  id: ActionMoonlightRotorcraftToggle
  name: activate flight
  description: Start the engine or land with the rotor running. During descent, abort landing; after touchdown, stop the rotor.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
    icon:
      sprite: _Moonlight/Actions/misc.rsi
      state: toggle_flight
    iconOn:
      sprite: _Moonlight/Actions/misc.rsi
      state: toggle_flight_on
  - type: InstantAction
    event: !type:MoonlightRotorcraftToggleActionEvent

- type: entity
  id: ActionMoonlightRotorcraftUp
  name: ascend
  description: Lift off or abort landing, or select the Z-level above while airborne.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
    icon:
      sprite: _Moonlight/Actions/misc.rsi
      state: up
  - type: InstantAction
    event: !type:MoonlightRotorcraftUpActionEvent

- type: entity
  id: ActionMoonlightRotorcraftDown
  name: descend
  description: Land on the floor beneath the vehicle, or select the lower Z-level over open space.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
    icon:
      sprite: _Moonlight/Actions/misc.rsi
      state: down
  - type: InstantAction
    event: !type:MoonlightRotorcraftDownActionEvent
