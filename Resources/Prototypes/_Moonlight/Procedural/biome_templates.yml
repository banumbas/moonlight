- type: biomeTemplate
  id: GrasslandsMoonlight
  layers:
    # Sparse vegetation
    - !type:BiomeDecalLayer
      allowedTiles:
        - MoonlightGrass
        - MoonlightGrassLight
        - MoonlightGrassTall
      divisions: 2
      threshold: -0.50
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
      decals:
        - BushDOne
        - BushDTwo
        - BushDThree
    - !type:BiomeDecalLayer
      allowedTiles:
        - MoonlightGrass
        - MoonlightGrassLight
        - MoonlightGrassTall
      divisions: 1
      threshold: 0.8
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 1
      decals:
        - FlowersBROne
        - FlowersBRTwo
        - FlowersBRThree

    # Dense vegetation
    - !type:BiomeDecalLayer
      allowedTiles:
        - MoonlightGrass
        - MoonlightGrassLight
        - MoonlightGrassTall
      divisions: 1
      threshold: -0.35
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - BushAOne
        - BushATwo
        - BushAThree
        - BushCOne
        - BushCTwo
        - BushCThree
    - !type:BiomeEntityLayer
      threshold: 0.5
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - MoonlightGrass
        - MoonlightGrassLight
        - MoonlightGrassTall
      entities:
        - FloraTree
        - FloraTreeLarge

    - !type:BiomeDummyLayer
      id: Loot

    # Surface rivers and their steam outlets remain on the plains.
    - !type:BiomeEntityLayer
      allowedTiles:
        - MoonlightGrass
        - MoonlightDirt
        - MoonlightGrassLight
        - MoonlightGrassTall
      threshold: 0.95
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.003
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
      entities:
        - MoonlightWater
    - !type:BiomeEntityLayer
      threshold: 0.985
      noise:
        seed: 37
        noiseType: OpenSimplex2
        frequency: 0.65
      allowedTiles:
        - MoonlightGrass
        - MoonlightDirt
        - MoonlightGrassLight
        - MoonlightGrassTall
      entities:
        - MoonlightGeyserOutletSteam

    # Plains contain no cave rocks: only grass variants and river dirt.
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: MoonlightGrass
    - !type:BiomeTileLayer
      tile: MoonlightGrassLight
      allowedTiles:
        - MoonlightGrass
      threshold: 0.20
      noise:
        seed: 21
        noiseType: OpenSimplex2
        frequency: 0.035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: MoonlightGrassTall
      allowedTiles:
        - MoonlightGrassLight
      threshold: 0.58
      noise:
        seed: 21
        noiseType: OpenSimplex2
        frequency: 0.035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: MoonlightDirt
      allowedTiles:
        - MoonlightGrass
        - MoonlightGrassLight
        - MoonlightGrassTall
      threshold: 0.95
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.003
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
