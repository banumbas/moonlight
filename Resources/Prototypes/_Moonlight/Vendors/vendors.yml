- type: entity
  parent: VendingMachine
  id: MoonlightPointsVendorBase
  abstract: true
  components:
  - type: MoonlightAutomatedVendor
    pointsType: Points
    sound:
      path: /Audio/Machines/machine_vend.ogg
  - type: ActivatableUI
    key: enum.MoonlightAutomatedVendorUI.Key
  - type: UserInterface
    interfaces:
      enum.MoonlightAutomatedVendorUI.Key:
        type: MoonlightAutomatedVendorBui

- type: entity
  parent: MoonlightPointsVendorBase
  id: MoonlightTestPointsVendor
  name: test points vendor
  description: A test vendor for spending points.
  components:
  - type: Sprite
    sprite: _Moonlight/Structures/Machines/VendingMachines/ColMarTech/equipment.rsi
    layers:
    - state: base
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: MoonlightAutomatedVendor
    pointsType: null
    userWhitelist:
      components:
      - MoonlightVendorUser
    sections:
    - name: Weapons
      entries:
      - id: WeaponPistolViper
        points: 50
        name: Viper Pistol
      - id: WeaponShotgunDoubleBarreled
        points: 100
        name: Double-Barreled Shotgun
    - name: Ammo
      entries:
      - id: BoxMagazinePistolRubber
        points: 10
      - id: BoxLethalshot
        points: 20

- type: entity
  parent: MobHuman
  id: MobHumanPointsTest
  name: points tester
  suffix: Points
  components:
  - type: MoonlightVendorUser
    points: 150
