- type: entity
  id: MoonlightActionZLevelUp
  name: Move up
  description: Move up one Z-Level
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
    icon:
      sprite: _Moonlight/Actions/misc.rsi
      state: up
  - type: InstantAction
    event: !type:MoonlightZLevelActionUp

- type: entity
  id: MoonlightActionZLevelDown
  name: Move down
  description: Move down one Z-Level
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
    icon:
      sprite: _Moonlight/Actions/misc.rsi
      state: down
  - type: InstantAction
    event: !type:MoonlightZLevelActionDown

- type: entity
  parent: BaseToggleAction
  id: MoonlightActionToggleLookUp
  name: Look up
  description: You lift your head and look up at the sky.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
    icon:
      sprite: _Moonlight/Actions/misc.rsi
      state: eye_down
    iconOn:
      sprite: _Moonlight/Actions/misc.rsi
      state: eye_up

