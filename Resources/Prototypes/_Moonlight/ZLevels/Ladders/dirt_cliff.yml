  name: dirt cliff
  description: TODO
  components:
  - type: Sprite
    sprite: _Moonlight/Structures/Architecture/Ladders/dirt_cliff.rsi
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
