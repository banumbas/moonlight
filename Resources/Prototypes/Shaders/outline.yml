
- type: shader
  id: SelectionOutline
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#FFFFFFFF" # moonlight-edit
    outline_fullbright: true # moonlight-add
    light_boost: 2
    light_gamma: 1.5
    light_whitepoint: 48

- type: shader
