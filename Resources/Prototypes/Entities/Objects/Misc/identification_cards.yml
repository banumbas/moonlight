- type: entity
  parent: Clothing
  id: IDCardStandard
  name: identification card
  description: A card necessary to access various areas aboard the station.
  abstract: true
  components:
  - type: Sprite
    sprite: _Moonlight/Objects/Misc/id_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: _Moonlight/Objects/Misc/id_cards.rsi
  - type: Item
    size: Small
    # World and worn card faces use the SS13 RSI. Keep the original item RSI
    # here because it supplies all directional in-hand states.
    sprite: Objects/Misc/id_cards.rsi
    heldPrefix: default
    storedRotation: -90
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
  - type: StealTarget
    stealGroup: IDCard
  - type: NanoChatCard # CD

#IDs with layers

- type: entity
  parent: IDCardStandard
