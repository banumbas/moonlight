- type: gameMap
  id: ClassicDev
  mapName: Classic Dev
  mapPath: /Maps/Test/dev_map.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 0
  stations:
    Dev:
      stationProto: StandardClassicStation
      components:
      - type: StationNameSetup
        mapNameTemplate: Classic Dev
      - type: StationJobs
        availableJobs:
          Captain: [-1, -1]
      - type: ClassicStationBiome
        biome: GrasslandsClassic
        parallax: Dirt
        undergroundLevels:
        - depth: -1
          biome: ClassicUndergroundDirtStone
          loadEntities: true
        - depth: -2
          biome: ClassicUndergroundCaves
          loadEntities: true
        - depth: -3
          biome: ClassicUndergroundMagma
          loadEntities: true
          parallax: ClassicMagma
          mapLightColor: "#48160c"
          temperature: 343.15
      - type: ClassicStationZLevels
        mapsBelow:
        - /Maps/_Classic/ZLevels/empty.yml
        - /Maps/_Classic/ZLevels/empty.yml
        - /Maps/_Classic/ZLevels/empty.yml
        mapsAbove:
        - /Maps/_Classic/ZLevels/empty.yml
        - /Maps/_Classic/ZLevels/empty.yml
        - /Maps/_Classic/ZLevels/empty.yml
        zLevelsComponentOverrides:
        - type: MapAtmosphere
          space: false
          mixture:
            volume: 2500
            immutable: true
            temperature: 293.15
            moles:
              Oxygen: 21.824879
              Nitrogen: 82.10312
        - type: Parallax
          parallax: Dirt
        - type: ClassicZLevelRoof
        - type: ClassicAutoGridGravity
      - type: ClassicStationMapRules
        rules:
        - ClassicDevOutpost

- type: entity
  parent: BaseGameRule
  id: ClassicDevOutpost
  components:
  - type: ClassicMergeMapRule
    zMap: Outpost
    targetDepth: 0
    biomeGroundDepth: 0
    randomPlacement: true
    minDistance: 24
    maxDistance: 48
